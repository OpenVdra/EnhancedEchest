name: Deploy VitePress docs to GitHub Pages

on:
  # Publish the documentation from the exact commit that successfully completed
  # the Release workflow. Regular pushes never replace the released Javadocs.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy (leave blank for the latest published release)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'OpenVdra/EnhancedEchest' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve released commit
        id: release-ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            REF="${{ github.event.workflow_run.head_sha }}"
          else
            TAG="$REQUESTED_TAG"
            if [ -z "$TAG" ]; then
              TAG=$(gh release view --repo "$REPO" --json tagName --jq '.tagName')
            else
              gh release view "$TAG" --repo "$REPO" >/dev/null
            fi
            REF="$TAG"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-ref.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: docs/node_modules
          key: ${{ runner.os }}-node-22-modules-${{ hashFiles('docs/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-modules-

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Generate Javadocs
        run: |
          chmod +x gradlew
          ./gradlew javadoc --no-daemon

      - name: Build VitePress
        working-directory: docs
        run: npm run docs:build

      - name: Add Javadocs to the Pages site
        run: |
          mkdir -p docs/.vitepress/dist/javadocs
          cp -R build/docs/javadoc/. docs/.vitepress/dist/javadocs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.repository == 'OpenVdra/EnhancedEchest'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
