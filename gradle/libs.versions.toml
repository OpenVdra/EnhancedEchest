[versions]
# Only versions shared by more than one coordinate. Single-use versions stay inline below.
paper = "1.21.11-R0.1-SNAPSHOT"
lombok = "1.18.48"
sqlite = "3.53.4.0"

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
run-paper = { id = "xyz.jpenilla.run-paper", version = "3.1.0" }

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# Shaded into the plugin jar and relocated under com.enhancedechest.libs.
hikaricp = { module = "com.zaxxer:HikariCP", version = "7.1.0" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version = "3.5.10" }
postgresql = { module = "org.postgresql:postgresql", version = "42.7.13" }
bstats = { module = "org.bstats:bstats-bukkit", version = "3.2.1" }
faststats = { module = "dev.faststats.metrics:bukkit", version = "0.30.1" }
jedis = { module = "redis.clients:jedis", version = "8.0.1" }

# Server classpath, never shaded or relocated (relocation would break sqlite native extraction
# and rewrite gson references to a package that isn't in the jar).
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
gson = { module = "com.google.code.gson:gson", version = "2.14.0" }
